services:
  db:
    image: postgres:16-alpine
    container_name: gametracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: gametracker
      POSTGRES_DB: gametracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: